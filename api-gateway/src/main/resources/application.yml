spring.application.name: api-gateway

server.port: 8080

eureka.client.service-url.defaultZone: http://localhost:8761/eureka

jwt.secretKey: asdfghjklqwertyuiopzxcvbnmqwertyuiopzxcvbnmasdfghjklqwertyuiopasdfghjklzxcvbnm

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users_service/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: lb://POSTS-SERVICE
          predicates:
            - Path=/api/v1/posts_service/**
          filters:
            - StripPrefix=2
            - name : AuthenticationFilter

        - id: connections-service
          uri: lb://CONNECTIONS-SERVICE
          predicates:
            - Path=/api/v1/connections_service/**
          filters:
            - StripPrefix=2
            - name : AuthenticationFilter

